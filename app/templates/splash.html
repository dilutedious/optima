{% extends "base.html" %}
{% block title %}Optima — Welcome{% endblock %}
{% block body_class %}splash-page{% endblock %}
{% block layout %}
<div class="splash-wrap">
  <div class="splash">
    <img class="logo-big" src="{{ url_for('static', filename='img/optima.png') }}" alt="Optima">
    <h1>OPTIMA</h1>
    <p>Automated Study Flow</p>
    <div class="actions">
      <a class="btn primary" href="{{ url_for('login') }}">Sign in</a>
      <a class="btn" href="{{ url_for('signup') }}">Create account</a>
    </div>
  </div>
</div>
{% endblock %}
